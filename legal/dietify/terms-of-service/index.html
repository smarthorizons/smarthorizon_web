<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms of Use - Dietify</title>
<script>
(function () {
  var theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  document.addEventListener('DOMContentLoaded', function () {
    if (!theme) return;
    document.querySelectorAll('a[href^="/legal/dietify/"]').forEach(function (a) {
      a.href = a.getAttribute('href') + (a.getAttribute('href').indexOf('?') < 0 ? '?' : '&') + 'theme=' + theme;
    });
  });
})();
</script>
<style>
:root{--bg:#F4F6F1;--surface:#FFFFFF;--surface-2:#F0F4EA;--line:#E3E8DC;--ink:#17211A;--ink-2:#4E5A50;--ink-3:#646E62;--brand:#237A3B;--accent-soft:#EAF5DA;
--shadow:0 1px 2px rgba(23,33,26,.04),0 8px 24px rgba(23,33,26,.07);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E130F;--surface:#171E18;--surface-2:#1D261E;--line:#263027;--ink:#EEF3EA;--ink-2:#B7C0B3;--ink-3:#8F998C;--brand:#8CC63F;--accent-soft:#22331A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E130F;--surface:#171E18;--surface-2:#1D261E;--line:#263027;--ink:#EEF3EA;--ink-2:#B7C0B3;--ink-3:#8F998C;--brand:#8CC63F;--accent-soft:#22331A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:8px 20px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.02em;margin:16px 0 0}
h2{font-size:17px;line-height:23px;font-weight:700;margin:14px 0 0}
h3{font-size:15px;line-height:21px;font-weight:700;margin:6px 0 0}
p,li{font-size:15px;line-height:24px;font-weight:500;color:var(--ink-2);margin:0}
ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px}
li ul{margin-top:4px}
strong{color:var(--ink);font-weight:700}
a{color:var(--brand);text-decoration:none;font-weight:600}
code{font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.version{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:16px;font-weight:600}
.glance{background:var(--accent-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.glance-title{font-size:13px;line-height:18px;font-weight:700;color:var(--ink)}
.glance p,.glance li{font-size:14px;line-height:21px;color:var(--ink)}
.table{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;vertical-align:top;padding:10px 14px;font-size:13px;line-height:19px;border-top:1px solid var(--line)}
th{background:var(--surface-2);font-weight:700;border-top:0}
td{color:var(--ink-2);font-weight:500}
td:first-child{color:var(--ink);font-weight:600}
footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;line-height:20px;color:var(--ink-3);display:flex;flex-direction:column;gap:4px}
.entry{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.entry-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.badge{font-size:11px;line-height:16px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--brand)}

.state{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spin{width:36px;height:36px;border-radius:999px;border:3px solid var(--line);border-top-color:var(--brand);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
</style>
</head>
<body>
<div class="state" id="loading"><div class="spin"></div></div>
<div class="state" id="error" style="display:none"><p>Couldn't load this page.</p><button onclick="load()">Try again</button></div>
<script>
async function load() {
  document.getElementById('loading').style.display = '';
  document.getElementById('error').style.display = 'none';
  try {
    const log = await fetch('/legal/dietify/changelog.json', {cache: 'no-store'}).then(r => r.json());
    const version = log.terms_of_service.current_version;
    const doc = await fetch('/legal/dietify/versions/terms/' + version + '.html', {cache: 'no-store'}).then(r => r.text());
    document.open(); document.write(doc); document.close();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = '';
  }
}
window.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
